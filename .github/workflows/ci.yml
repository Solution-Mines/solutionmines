name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install
        # Frozen lockfile: a drifted lockfile fails here rather than silently
        # resolving different versions than were tested.
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        # This is also the content-validation step. Service and case-study
        # frontmatter is parsed through Zod at module load, and the registry
        # throws on a broken cross-reference, so malformed content fails the
        # build here instead of rendering a broken page in production.
        env:
          SITE_ENV: staging
          NEXT_PUBLIC_SITE_URL: https://example.invalid
        run: pnpm build

      - name: Smoke-test the production server
        # A build that compiles can still fail to boot — instrumentation.ts
        # deliberately throws on a partial mail configuration. Starting the
        # real standalone bundle is the only way to catch that before deploy.
        run: |
          pnpm package
          node .next/standalone/server.js &
          server_pid=$!
          for i in $(seq 1 30); do
            if curl -fsS --max-time 2 http://127.0.0.1:3000/api/health >/dev/null; then
              echo "server answered after ${i}s"
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "server exited during startup"; exit 1
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/api/health | tee /dev/stderr | grep -q '"status":"ok"'
          curl -fsS http://127.0.0.1:3000/ | grep -q "SolutionMines"
          kill "$server_pid"
        env:
          PORT: 3000

  deploy-scripts:
    # The server scripts decide whether a box that may host someone else's
    # site gets changed at all. A syntax error or a regression in that logic
    # must fail here, not on the server. Apart from installing gawk, nothing
    # in this job touches the runner: the tests stub preflight, docker, curl
    # and the edge commands, and run without root.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Syntax
        run: |
          set -euo pipefail
          for f in deploy/*.sh deploy/test/*.sh; do
            bash -n "$f"
            echo "ok  $f"
          done

      - name: ShellCheck
        # Preinstalled on ubuntu-latest. Warnings and errors fail the job;
        # style notes do not.
        run: |
          shellcheck --version
          shellcheck --severity=warning deploy/*.sh deploy/test/*.sh

      - name: Second awk for the preflight tests
        # preflight.test.sh runs every case under each awk it finds. Servers
        # run mawk (Ubuntu's default) or gawk, so test both. Only the runner
        # changes; if the install fails, the tests still run under mawk.
        run: |
          command -v gawk >/dev/null \
            || { sudo apt-get update -qq && sudo apt-get install -y -qq gawk; } \
            || echo "::warning::gawk could not be installed; preflight is tested under mawk only"

      - name: Tests
        run: bash deploy/test/run-all.sh

  image:
    # Builds the production image WITHOUT pushing it. The deploy workflow only
    # runs on main, so without this a Dockerfile mistake would not surface
    # until the moment of deploy — which is the worst possible time to find
    # out. Same layer cache as the deploy build, so this also warms it.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: solutionmines:ci
          build-args: |
            GIT_COMMIT_SHA=${{ github.sha }}
            SITE_ENV=staging
            NEXT_PUBLIC_SITE_URL=https://example.invalid
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run it and prove it serves
        # A built image is not a working one. This starts the real container
        # exactly as the server will — same entrypoint, same non-root user —
        # and checks that the commit it reports is the one that was baked in,
        # which is the same assertion deploy.sh makes before switching nginx.
        run: |
          set -euo pipefail
          docker run -d --name sm-ci -p 127.0.0.1:3000:3000 solutionmines:ci
          for i in $(seq 1 40); do
            if curl -fsS --max-time 2 http://127.0.0.1:3000/api/health >/dev/null 2>&1; then
              break
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' sm-ci)" != "true" ]; then
              echo "container exited during startup"; docker logs sm-ci; exit 1
            fi
            sleep 1
          done
          body="$(curl -fsS --max-time 5 http://127.0.0.1:3000/api/health)"
          echo "$body"
          echo "$body" | grep -q '"status":"ok"'
          echo "$body" | grep -q "\"commit\":\"${{ github.sha }}\"" \
            || { echo "image reports the wrong commit"; exit 1; }
          curl -fsS http://127.0.0.1:3000/ | grep -q "SolutionMines"
          echo "image serves correctly and reports the expected commit"

      - name: Container logs on failure
        if: failure()
        run: docker logs sm-ci || true

      - name: Clean up
        if: always()
        run: docker rm -f sm-ci || true
