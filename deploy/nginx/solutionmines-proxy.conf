# Shared proxy settings. Install to /etc/nginx/conf.d/.
proxy_pass http://solutionmines_app;
proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection "upgrade";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
# Without this, Next generates http:// URLs in metadata and redirects, so
# canonical tags and the sitemap quietly point at the wrong scheme.
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_read_timeout 30s;
proxy_connect_timeout 5s;
# Let nginx fail over to the other colour if one is mid-restart.
proxy_next_upstream error timeout http_502 http_503 http_504;
