# ============================================================================
# TLS site. Installed by enable-tls.sh AFTER certbot has issued, with
# __DOMAIN__ substituted. Install target:
#   /etc/nginx/sites-available/solutionmines
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # deploy.sh's smoke test asks http://127.0.0.1/api/health, from the box
    # itself, for the commit it just deployed. It must reach the app through
    # nginx rather than the redirect, or every deploy after TLS rolls back.
    # Everyone else gets the redirect, as for any other path.
    location = /api/health {
        if ($remote_addr !~ "^(127\.0\.0\.1|::1)$") {
            return 301 https://__DOMAIN__$request_uri;
        }
        include /etc/nginx/snippets/solutionmines-proxy.conf;
        add_header Cache-Control "no-store" always;
    }

    location / {
        return 301 https://__DOMAIN__$request_uri;
    }
}

# Anything hitting the box on an IP or an unknown Host gets nothing. Without
# this, the site answers on every hostname that resolves here, which is how
# scraped copies end up indexed under someone else's domain.
#
# HTTP/2 is switched on in the `listen` lines, not with `http2 on;`: that
# directive only exists from nginx 1.25.1, and Ubuntu 24.04 ships 1.24
# (22.04: 1.18, Debian 12: 1.22), where it fails `nginx -t`. Newer nginx
# accepts the listen form with a deprecation warning.
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;
    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    return 444;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__ www.__DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # One canonical host. Serving both apex and www is the most common
    # duplicate-content error on a small site.
    if ($host = www.__DOMAIN__) {
        return 301 https://__DOMAIN__$request_uri;
    }

    # --- security headers ---------------------------------------------------
    # HSTS is deliberately commented out. Enable it only after
    # `certbot renew --dry-run` passes — for the max-age you publish it is
    # effectively irreversible, and preload entirely so.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Report-only first. Review reports, then promote to the enforced header.
    # Shipping CSP enforced on day one breaks things nobody notices until a
    # visitor does. 'unsafe-inline' on script-src covers Next's inline
    # bootstrap and the blocking motion-preference script in <head>.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    client_max_body_size 1m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    # Content-hashed filenames, so immutable is both safe and correct.
    location /_next/static/ {
        include /etc/nginx/snippets/solutionmines-proxy.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location /_next/image {
        include /etc/nginx/snippets/solutionmines-proxy.conf;
        add_header Cache-Control "public, max-age=86400";
    }

    # The contact form is the only writable surface. Limiting it here is a
    # second, instance-independent layer over the in-process rate limiter.
    location /contact {
        limit_req zone=sm_contact burst=5 nodelay;
        include /etc/nginx/snippets/solutionmines-proxy.conf;
    }

    location /api/ {
        limit_req zone=sm_general burst=20 nodelay;
        include /etc/nginx/snippets/solutionmines-proxy.conf;
        add_header Cache-Control "no-store" always;
    }

    location / {
        limit_req zone=sm_general burst=40 nodelay;
        include /etc/nginx/snippets/solutionmines-proxy.conf;
        # nginx must NOT cache HTML. Blind HTML caching in front of Next
        # produces stale-deploy bugs that are miserable to diagnose.
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }
}
